
services:
  postgres:
    image: postgres:16-alpine
    container_name: ft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: energy_trading
    ports:
      - "127.0.0.1:5433:5432" # loopback only: known password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_trading"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ft-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # loopback only: no auth
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Phase 7 integration smoke (use with: docker compose --profile test up -d)
  hardhat:
    profiles: ["test"]
    image: node:20-bookworm
    container_name: ft-hardhat
    working_dir: /contracts
    volumes:
      - ./contracts:/contracts
    command: ["bash", "-lc", "npm ci && npx hardhat node --hostname 0.0.0.0 --port 8545"]
    ports:
      - "127.0.0.1:8545:8545" # loopback only: account 0 (operator) is unlocked
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_chainId',params:[],id:1})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
